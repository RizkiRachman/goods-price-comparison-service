name: DAST - OWASP ZAP API Scan

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 7 AM
  workflow_dispatch:

jobs:
  zap-scan:
    name: API Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>RizkiRachman</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Start application
        run: |
          mvn spring-boot:run -Dspring-boot.run.profiles=test -q &
          timeout=60
          elapsed=0
          until curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api-docs | grep -q 200; do
            if [ $elapsed -ge $timeout ]; then
              echo "App failed to start within ${timeout}s"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Application is ready"

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8080
          format: openapi
          spec_file: http://localhost:8080/api-docs
          allow_auto_fail: false
          fail_count: 10
          issue_title: OWASP ZAP API Scan Report
          cmd_options: '-a -j'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap-report.*
          retention-days: 30

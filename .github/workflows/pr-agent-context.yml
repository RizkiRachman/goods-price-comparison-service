name: PR Agent Context

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  context:
    name: Publish PR context for agents
    runs-on: ubuntu-latest
    steps:
      - name: Generate context comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const changed = files.slice(0, 50).map((f) => {
              return `- \`${f.filename}\` (${f.status}, +${f.additions} / -${f.deletions})`;
            }).join("\n");

            const body = [
              "## Agent Context",
              "",
              "**PR Goal**",
              `- ${pr.title}`,
              "",
              "**Diff Summary**",
              `- Files changed: ${pr.changed_files}`,
              `- Additions: ${pr.additions}`,
              `- Deletions: ${pr.deletions}`,
              "",
              "**Changed Files (first 50)**",
              changed || "- No file changes detected",
              "",
              "**Recommended Validation**",
              "- `mvn -B -ntp clean verify -U`",
              "- `./scripts/check-conventions.sh`",
              "- `mvn verify -P security-check` (for security-sensitive dependency or API changes)",
              "",
              "_This comment is auto-updated to help human and AI reviewers with fast context._"
            ].join("\n");

            const marker = "<!-- pr-agent-context -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100
            });

            const existing = comments.find((c) => c.user.type === "Bot" && c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: payload
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: payload
              });
            }

name: AI Autofix (Manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to autofix"
        required: true
        type: string
      run_verify:
        description: "Run mvn verify after autofix (slower)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Apply safe autofixes to PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR metadata
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number("${{ inputs.pr_number }}");
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput("number", String(pr.number));
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_repo", pr.head.repo.full_name);
            core.setOutput("is_fork", String(pr.head.repo.fork));

      - name: Stop when PR source is fork
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "Skipping autofix for fork PR for security reasons."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>RizkiRachman</username>
                <password>${{ secrets.GH_PACKAGES_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Apply formatter autofix
        run: mvn -B -ntp spotless:apply -U

      - name: Optional verify gate
        if: inputs.run_verify == true
        run: mvn -B -ntp verify -U

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ci): apply automated formatter fixes"
          git push origin "${{ steps.pr.outputs.head_ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment result on PR
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number("${{ steps.pr.outputs.number }}");
            const changed = "${{ steps.commit.outputs.changed }}" === "true";

            const body = changed
              ? "Autofix completed: formatter updates were pushed to this PR branch."
              : "Autofix completed: no formatter changes were needed.";

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

name: GHCR Retention (Keep Latest)

on:
  workflow_run:
    workflows: ["Publish - Artifacts & Containers"]
    types: [completed]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: Remove old GHCR versions
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest container version
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo.toLowerCase();

            const { data: ownerInfo } = await github.rest.users.getByUsername({
              username: owner
            });
            const isOrg = ownerInfo.type === "Organization";

            const fetchVersions = async (page) => {
              if (isOrg) {
                return github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  per_page: 100,
                  page
                });
              }
              return github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                username: owner,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
                page
              });
            };

            const deleteVersion = async (versionId) => {
              if (isOrg) {
                return github.rest.packages.deletePackageVersionForOrg({
                  org: owner,
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: versionId
                });
              }
              return github.rest.packages.deletePackageVersionForUser({
                username: owner,
                package_type: "container",
                package_name: packageName,
                package_version_id: versionId
              });
            };

            const allVersions = [];
            for (let page = 1; ; page++) {
              const response = await fetchVersions(page);
              const versions = response.data || [];
              if (versions.length === 0) break;
              allVersions.push(...versions);
              if (versions.length < 100) break;
            }

            if (allVersions.length <= 1) {
              core.info("Nothing to clean up. One or no versions found.");
              return;
            }

            const sorted = allVersions
              .filter((v) => v.state === "active")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const [latest, ...oldVersions] = sorted;
            core.info(`Keeping latest version id=${latest.id}`);

            for (const version of oldVersions) {
              await deleteVersion(version.id);
              core.info(`Deleted old version id=${version.id}`);
            }

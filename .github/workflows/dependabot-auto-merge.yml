name: Dependabot - Auto Merge (Safe Updates)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  auto-merge:
    name: Enable auto-merge for low-risk Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for patch/minor updates
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const hasMajorSignal = /major/i.test(pr.title) || /breaking/i.test(pr.title);
            if (hasMajorSignal) {
              core.info("Major/breaking change detected. Skipping auto-merge.");
              return;
            }

            // Enable GitHub auto-merge. Merge executes only after required checks pass.
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: pr.node_id }
            );

            core.info(`Auto-merge enabled for PR #${pr.number} in ${owner}/${repo}.`);

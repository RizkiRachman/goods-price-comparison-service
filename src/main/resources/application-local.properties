# =============================================
# Local Development Configuration (H2 In-Memory)
# =============================================
# This file provides a working local development configuration
# using H2 in-memory database - no PostgreSQL required.
#
# Usage: Run with --spring.profiles.active=local
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Or set environment variable:
#   export SPRING_PROFILES_ACTIVE=local

# Import modular configurations
spring.config.import=classpath:config/database.properties,\
                      classpath:config/cache.properties,\
                      classpath:config/llm.properties,\
                      classpath:config/features.properties,\
                      classpath:config/logging.properties,\
                      classpath:config/service.properties

# =============================================
# Application Profile
# =============================================
# Note: This file is loaded when 'local' profile is active
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
app.environment=local

# =============================================
# Database (H2 In-Memory for Local Dev)
# =============================================
# Override database.properties settings for local development
spring.datasource.url=jdbc:h2:mem:goodspricedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - Disabled for local dev (Hibernate handles schema creation for H2)
spring.flyway.enabled=false

# =============================================
# LLM Configuration
# =============================================
# Use local provider (no API key needed for basic testing)
llm.provider=local

# Local Ollama settings (if installed)
llm.local.base-url=http://localhost:11434
llm.local.model=llama3.2-vision

# =============================================
# Logging
# =============================================
logging.level.root=INFO
logging.level.com.example.goodsprice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

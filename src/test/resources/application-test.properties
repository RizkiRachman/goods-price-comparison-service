# Test Configuration

# Import modular configurations (same as main)
spring.config.import=classpath:config/database.properties,\
                      classpath:config/cache.properties,\
                      classpath:config/llm.properties,\
                      classpath:config/features.properties,\
                      classpath:config/logging.properties,\
                      classpath:config/service.properties

# Use local provider for tests (no API key needed)
llm.provider=local

# LLM API keys (empty for tests - local provider used)
LLM_OPENAI_API_KEY=
LLM_ANTHROPIC_API_KEY=
LLM_GEMINI_API_KEY=

# Database parameter defaults (overridden by H2 config below)
DATABASE_NAME=testdb
DATABASE_USERNAME=sa
DATABASE_PASSWORD=
DATABASE_HOST=localhost
DATABASE_PORT=5432

# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway - Disabled for tests (Hibernate handles schema creation for H2)
spring.flyway.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.example.goodsprice=DEBUG
logging.level.org.springframework.test=INFO